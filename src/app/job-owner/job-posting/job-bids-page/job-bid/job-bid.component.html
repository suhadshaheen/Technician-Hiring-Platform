<div class="job-card d-flex justify-content-between align-items-center p-3 rounded-3 shadow-sm mb-3">
    <div class="d-flex align-items-center">
      <div class="avatar   fw-bold rounded-circle me-3 d-flex justify-content-center align-items-center">
        B
      </div>
      <h5 class="mb-0">{{ title }}</h5> 
      <span>{{ date }}</span>
    </div>
    <div> 
      <a href=""><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-people-fill" viewBox="0 0 512 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M64 0C28.7 0 0 28.7 0 64L0 352c0 35.3 28.7 64 64 64l96 0 0 80c0 6.1 3.4 11.6 8.8 14.3s11.9 2.1 16.8-1.5L309.3 416 448 416c35.3 0 64-28.7 64-64l0-288c0-35.3-28.7-64-64-64L64 0z"/></svg>
      </a>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-success" [disabled]="!canEdit" (click)="approve()">Approve</button>
        <button class="btn btn-danger" (click)="reject()">Reject</button>
    </div>
  </div>
