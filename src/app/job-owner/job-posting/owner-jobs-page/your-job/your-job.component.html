<div class="job-card d-flex justify-content-between align-items-center p-3 rounded-3 shadow-sm mb-3">
    <div class="d-flex align-items-center">
      <div class="avatar   fw-bold rounded-circle me-3 d-flex justify-content-center align-items-center">
        J
      </div>
      <h5 class="mb-0">{{ title }}</h5>
    </div>
  
    <div class="d-flex gap-2">
      <button class="btn bids-button " [routerLink]="['/jobOwner/Bids']">Bids</button>
      <div class="d-flex flex-column gap-2">
        <button class="btn btn-secondary" [disabled]="!canEdit" [routerLink]="['/jobOwner/Edit']">Edit</button>
        <button class="btn btn-danger" data-bs-toggle="modal" [attr.data-bs-target]="'#deleteConfirmModal' + jobId">Delete</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
<div class="modal fade" [id]="'deleteConfirmModal' + jobId" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete this job?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>
