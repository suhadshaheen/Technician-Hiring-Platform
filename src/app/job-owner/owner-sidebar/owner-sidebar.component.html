        <div >
        <a href="#" class="footer-item link-underline link-underline-opacity-0">Contact Us</a>
        <a href="#" class="footer-item link-underline link-underline-opacity-0 ">About Us</a>
        </div>

<!-- Sign out Confirmation Modal -->
  <div class="modal fade" id="cancelModal" tabindex="-1" aria-labelledby="cancelModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="cancelModalLabel">Signing out your account</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              Are you sure you want to signing out your account?
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
              <button type="button" class="btn btn-danger"  data-bs-dismiss="modal" (click)="confirmSignOutAndLogout()">Yes</button>
            </div>
          </div>
        </div>
  </div>
