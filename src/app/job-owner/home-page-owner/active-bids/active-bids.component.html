<div class="container my-5">
  <h4 class="fw-bold mb-4 ">Your Job Posts</h4>

  <div class="row g-4">
    <div class="col-md-4" *ngFor="let job of jobPosts">
      <div class="p-3 bg-light rounded shadow-sm h-100 d-flex flex-column justify-content-between">
        <div class="d-flex align-items-center mb-3">

          <div>
            <h6 class="mb-1">{{ job.title }}</h6>
            <small class="text-muted">Budget: ${{ job.budget }}</small><br />
            <small class="text-muted">Deadline: {{ job.deadline }}</small>
          </div>
        </div>

        <div class="d-flex justify-content-between">
          <button class="btn custom-login-btn px-2 py-1" [routerLink]="['./Bids']">Bids</button>
          <button class="btn custom-login-btn px-2 py-1" [disabled]="!job.canEdit" [routerLink]="['/jobOwner/Edit']">Edit</button>
          <button class="btn custom-login-btn px-2 py-1" data-bs-toggle="modal" data-bs-target="#deleteConfirmModal">Delete</button>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirm Deletion</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete this job?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" (click)="confirmDelete()">Delete</button>
          </div>
        </div>
      </div>
    </div>
 
  </div>
  <div class="text-center mt-4">
    <button class="btn custom-login-btn px-4 py-2" [routerLink]="['./OwnerJobs']">View All</button>
  </div>
</div>
