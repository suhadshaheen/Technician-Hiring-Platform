<div class="container text-center my-5">
  <h4 class="fw-bold mb-4">Top-Rated Artisans</h4>

  <div class="row g-4 justify-content-center">
    <div class="col-md-4 mb-5" *ngFor="let review of reviews">
      <div class="p-3 bg-light rounded shadow-sm h-100">
        <div class="fw-semibold">{{ review.name }}</div>


        <div class="text-warning mb-1">
          <i *ngFor="let star of [1,2,3,4,5]"
             class="fa-star small"
             [class.fa-solid]="star <= review.rating"
             [class.fa-regular]="star > review.rating">
          </i>
          <span class="text-muted small ms-2">({{ review.rating }}/5)</span>
        </div>


        <div class="small">{{ review.comment || 'No comment provided.' }}</div>
      </div>
    </div>
  </div>
</div>
