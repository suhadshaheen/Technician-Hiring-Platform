<div class="container mt-4">
  <div class="row mb-4">
    <div class="col-md-8 ss-searchbar d-flex align-items-center gap-2 custom-search-bar p-2 rounded-pill">
      <div class="flex-grow-1 position-relative">
        <input type="text" class="form-control search-ss border-0 rounded-pill ps-4 pe-5" [(ngModel)]="searchText" *ngIf="showSearchBar" placeholder="Search For Job...">
      </div>

      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-outline-purble rounded-pill px-3 fw-bold" (click)="toggleFilterDropdown()" *ngIf="showSearchBar">
          <i class="fa-solid fa-filter me-2"></i> Filters
        </button>
      </div>

      <div class="filter-dropdown p-2 rounded-4 shadow-sm mb-4" [ngClass]="{'show': showFilters}">
        <div class="row ss-r">
          <div class="col-md-4 mb-3 su-s">
            <label class="form-label fw-semibold">Category</label>
            <select class="form-select ss-select rounded-pill" [(ngModel)]="selectedCategory">
              <option value="">All Categories</option>
              <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Location</label>
            <select class="form-select rounded-pill" [(ngModel)]="selectedLocation">
              <option value="">All Locations</option>
              <option *ngFor="let location of locations" [value]="location">{{ location }}</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Budget</label>
            <select class="form-select rounded-pill" [(ngModel)]="selectedBudget">
              <option value="">All Budgets</option>
              <option *ngFor="let budget of budgets" [value]="budget">{{ budget }}</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row" *ngIf="paginatedJobs.length > 0; else notFound">
    <div class="col-md-4 mb-4" *ngFor="let job of paginatedJobs">
      <app-job-card [job]="job"></app-job-card>
    </div>
  </div>

  <ng-template #notFound>
    <div class="text-center text-muted mt-5 fs-5">No jobs found</div>
  </ng-template>

  <div class="d-flex justify-content-center mt-4" *ngIf="totalPages > 1">
    <nav>
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="prevPage()"><i class="fa-solid fa-backward"></i></button>
        </li>

        <li class="page-item" *ngFor="let page of paginationPages" [class.active]="currentPage === page">
          <button class="page-link" (click)="goToPage(page)">{{ page }}</button>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="nextPage()"><i class="fa-solid fa-forward"></i></button>
        </li>
      </ul>
    </nav>
  </div>
</div>
