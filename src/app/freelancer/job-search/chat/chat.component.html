<div class="chat-container d-flex shadow position-relative mx-auto my-4 rounded"
     [ngClass]="{ 'sidebar-closed': !sidebarOpen }"
     style="height: 85vh; max-width: 1100px; width: 100%; overflow: hidden;">

  <button class="btn btn-light position-absolute d-md-none" style="z-index: 9999; top: 10px; left: 10px;" (click)="toggleSidebar()">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="chat-sidebar border-end p-3 overflow-auto bg-light h-100"
       [ngClass]="{ 'd-none': !sidebarOpen && isMobile }"
       style="width: 300px;">
    <h6 class="fw-bold mb-3">Recent Chats</h6>
    <div *ngFor="let msg of recentMessages"
         class="chat-recent-item d-flex align-items-center mb-3 p-2 rounded"
         role="button"
         [ngClass]="{ 'bg-white border': +msg.id === currentChatId }"
         (click)="openChat(msg.id)">
      <img [src]="msg.avatar" class="rounded-circle me-2" width="40" height="40" />
      <div class="flex-grow-1">
        <div class="fw-bold">{{ msg.name }}</div>
        <div class="text-muted small text-truncate" style="max-width: 200px;">{{ msg.text }}</div>
        <div class="text-muted small fst-italic">{{ msg.time }}</div>
      </div>
    </div>
  </div>

  <div class="chat-window flex-grow-1 d-flex flex-column bg-white">
    <div class="chat-header text-white text-center py-2" style="background-color: #40189d;">
      <h5 class="m-0">{{ currentOwnerName || 'Chat' }}</h5>
    </div>

    <div class="chat-messages flex-grow-1 overflow-auto p-3 d-flex flex-column gap-3" style="background-color: #f9f9f9;">
      <div *ngFor="let msg of messages"
           class="d-flex fade-in"
           [ngClass]="{
             'flex-row-reverse align-self-end': msg.from === 'me',
             'align-self-start': msg.from === 'owner'
           }">
        <img *ngIf="msg.from === 'owner'" [src]="msg.avatar" class="rounded-circle me-2" width="40" height="40" />
        <div class="rounded-pill px-3 py-2 text-white"
             [ngStyle]="{ 'background-color': '#40189d' }">
          {{ msg.text }}
          <div class="small text-light mt-1">{{ msg.timestamp }}</div>
        </div>
      </div>

      <div *ngIf="isTyping" class="text-muted fst-italic small">Typing...</div>
    </div>

    <div class="chat-input d-flex border-top p-2 bg-white">
      <input type="text"
             class="form-control me-2 rounded-pill"
             [(ngModel)]="newMessage"
             placeholder="Type your message..." />
      <button (click)="sendMessage()" class="btn rounded-pill"
              style="background-color: #40189d; color: white;">
        <i class="fa-regular fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>
