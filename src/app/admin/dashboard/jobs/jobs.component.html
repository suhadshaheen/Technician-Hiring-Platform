  <h4>All Jobs</h4>
            <div class="col-md-4" *ngFor="let job of filteredJobs">
                <div class="card shadow rounded h-100 position-relative animate-zoom">
                    <button [routerLink]="['/admin/job-details', job.id]"
                        class="btn btn-sm bg-white text-purple-600 border border-purple-600 rounded-pill position-absolute top-0 end-0 m-2">
                        Details
                    </button>
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                         <h5 class="card-title">{{ job.title }}</h5>
                            <p class="card-text">{{ job.description }}</p>
                            <p class="card-text"><i class="bi bi-geo-alt-fill text-primary"></i> {{ job.location
                                }}</p><p class="text-info"><small>Added on: {{ job.created_at | date:'mediumDate' }}</small></p>
                                
                        </div>
                        <div class="d-flex flex-column gap-2 mt-3">
                            <button class="btn btn-warning" (click)="updateStatus(job, 'pending')">Mark as
                                Pending</button>
                            <button class="btn btn-primary" (click)="updateStatus(job, 'in_progress')">Mark as
                                In Progress</button>
                            <button class="btn btn-success" (click)="updateStatus(job, 'completed')">Mark as
                                Completed</button>
                        </div>

                        <div class="mt-3 text-center">
                            <span class="badge" [ngClass]="{
          'bg-secondary': job.status === 'pending',
          'bg-info text-dark': job.status === 'in_progress',
          'bg-success': job.status === 'completed'
        }">
                                {{ job.status.replace('_', ' ') }}
                            </span>
                        </div>


                        <div class="mt-3 d-flex justify-content-end">
                            <button class="btn btn-outline-danger btn-sm" (click)="deleteJob(job)">Delete</button>
                        </div>
                    </div>
                </div>
            </div>

            <div *ngIf="filteredJobs.length === 0" class="alert alert-warning mt-4">
                No jobs found.
            </div>
        </div>
    </div>
