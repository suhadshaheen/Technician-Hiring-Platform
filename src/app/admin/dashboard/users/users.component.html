  <h4>All Registered Users</h4>
  <div class="row g-4">
    <div class="col-md-4" *ngFor="let artisan of filteredArtisans">
      <div class="card shadow rounded h-100 position-relative animate-zoom">
         <button [routerLink]="['/admin/freelancers', artisan.id]"
          class="btn btn-sm bg-white text-purple-600 border border-purple-600 rounded-pill position-absolute top-0 end-0 m-2">
          Details
        </button>
        <div class="card-body d-flex flex-column justify-content-between">
           <div>
            <h5 class="card-title">{{ artisan.firstname }} {{ artisan.lastname }}</h5>
            <p class="card-text">Location: {{ artisan.city }}, {{ artisan.country }}</p>
            <p class="text-info"><small>Added on: {{ artisan.created_at | date:'mediumDate' }}</small></p>
          </div>
          <div class="d-flex flex-column gap-2 mt-3">
            <button class="btn btn-danger" (click)="deleteArtisan(artisan)">Delete</button>
          </div>
        </div>
      </div>
    </div>
      <div *ngIf="filteredArtisans.length === 0" class="alert alert-warning mt-4">
                No artisans found.
            </div>
  </div>
</div>
