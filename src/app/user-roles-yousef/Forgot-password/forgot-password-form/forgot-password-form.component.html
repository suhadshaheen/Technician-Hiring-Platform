<div class="card p-4 shadow rounded-5 text-center" style="width: 95rem; z-index: 1; height: 49rem;">
  <h1 class="text-center fw-bold mt-5" style="font-family: 'Baloo 2', cursive;">Forgot Password?</h1>
  <hr class="border border-primary border-1 opacity-50 mt-5">

  <p class="text-center " style="font-size: larger;color: #A8A8A8">Enter your email address and we'll send<br> you a link to reset your password.</p>

<form (ngSubmit)="onSubmit()" #forgotForm="ngForm" >

  <div class="d-flex justify-content-center mb-4 mt-5">
    <div class="position-relative" style="max-width: 300px; width: 100%;">

      <svg xmlns="http://www.w3.org/2000/svg"
           class="position-absolute"
           style="left: 12px; top: 50%; transform: translateY(-50%);"
           height="20" width="20" viewBox="0 0 512 512">
        <path d="M64 112c-8.8 0-16 7.2-16 16l0 22.1L220.5 291.7c20.7 17 50.4 17 71.1 0L464 150.1l0-22.1c0-8.8-7.2-16-16-16L64 112zM48 212.2L48 384c0 8.8 7.2 16 16 16l384 0c8.8 0 16-7.2 16-16l0-171.8L322 328.8c-38.4 31.5-93.7 31.5-132 0L48 212.2zM0 128C0 92.7 28.7 64 64 64l384 0c35.3 0 64 28.7 64 64l0 256c0 35.3-28.7 64-64 64L64 448c-35.3 0-64-28.7-64-64L0 128z"/>
      </svg>


      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        class="form-control px-5 py-2 rounded-pill shadow border-black"
        placeholder="Email"
        required
        style="font-size: 0.95rem;"
      />
    </div>
  </div>



  <button
    type="submit"
    class="btn custom-forgot-btn px-4 py-2 rounded-pill mx-auto d-block"
    >
    Send Reset Link
  </button>


  <hr class="border border-primary border-1 opacity-50 mt-5">

  <button
    type="submit"
    class="btn custom-forgot-btn px-4 py-2 rounded-pill mx-auto mb-5 d-block"
  >
   Resend Email Confirmation
  </button>



    <a
      class="btn custom-forgot-btn px-4 py-2 rounded-pill mx-auto mb-5 "
      [routerLink]="''">
      Back to Login
    </a>





</form>
</div>
